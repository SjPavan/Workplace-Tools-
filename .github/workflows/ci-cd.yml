name: CI/CD Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # Backend Tests
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: false
        
    - name: Install dependencies
      working-directory: ./backend
      run: |
        poetry install
        
    - name: Run linting
      working-directory: ./backend
      run: |
        poetry run ruff check .
        poetry run black --check .
        
    - name: Run type checking
      working-directory: ./backend
      run: |
        poetry run mypy .
        
    - name: Run tests
      working-directory: ./backend
      run: |
        poetry run pytest --cov=app --cov-report=xml
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: backend-coverage

  # Frontend Tests
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
        
    - name: Install dependencies
      working-directory: ./web
      run: npm ci
      
    - name: Run linting
      working-directory: ./web
      run: npm run lint
      
    - name: Run type checking
      working-directory: ./web
      run: npm run typecheck
      
    - name: Run build
      working-directory: ./web
      run: npm run build
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        NEXT_PUBLIC_APP_NAME: Workplace Tools

  # Security Scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  # Deploy Preview (PR only)
  deploy-preview:
    name: Deploy Preview
    needs: [test-backend, test-frontend, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    environment: preview
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy Frontend to Vercel
      id: deploy-vercel
      uses: amondnet/vercel-action@v25
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: ./web
        scope: ${{ secrets.VERCEL_ORG_ID }}
        alias-domains: pr-${{ github.event.number }}-workplace-tools.vercel.app
        
    - name: Wait for deployment
      run: sleep 60
      
    - name: Run smoke tests
      run: |
        chmod +x ./scripts/smoke-test.sh
        ./scripts/smoke-test.sh "https://workplace-tools-api.onrender.com" "${{ steps.deploy-vercel.outputs.preview-url }}"
        
    - name: Comment PR with deployment info
      uses: actions/github-script@v7
      with:
        script: |
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          const botComment = comments.find(comment => 
            comment.user.type === 'Bot' && 
            comment.body.includes('🚀 Preview Deployment')
          );
          
          const previewUrl = '${{ steps.deploy-vercel.outputs.preview-url }}';
          const commentBody = `## 🚀 Preview Deployment
          
          **Frontend Preview:** ${previewUrl}
          
          **Backend API:** https://workplace-tools-api.onrender.com/health
          
          **Test Results:** ✅ All tests passed
          
          **Smoke Tests:** ✅ Health checks passed
          
          ---
          
          ### Quick Test Commands
          
          \`\`\`bash
          # Test backend health
          curl https://workplace-tools-api.onrender.com/health
          
          # Test AI endpoint
          curl -X POST \\
            -H "Content-Type: application/json" \\
            -d '{"message": "Hello, test!"}' \\
            https://workplace-tools-api.onrender.com/api/ai/complete
          \`\`\`
          
          This preview will be automatically updated when new commits are pushed to this PR.
          
          *This comment was automatically generated by GitHub Actions*`;
          
          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: commentBody,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody,
            });
          }

  # Deploy Production (main branch only)
  deploy-production:
    name: Deploy Production
    needs: [test-backend, test-frontend, security-scan]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy Frontend to Vercel Production
      uses: amondnet/vercel-action@v25
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: ./web
        vercel-args: '--prod'
        scope: ${{ secrets.VERCEL_ORG_ID }}
        
    - name: Notify deployment
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            state: 'success',
            target_url: 'https://workplace-tools.vercel.app',
            description: 'Production deployment successful',
            context: 'deployment/production'
          });