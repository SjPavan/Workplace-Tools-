name: Deploy Previews

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - main
      - develop

jobs:
  # Backend Tests
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: false

      - name: Install dependencies
        working-directory: ./backend
        run: |
          poetry install

      - name: Run tests
        working-directory: ./backend
        run: |
          poetry run pytest

      - name: Run linting
        working-directory: ./backend
        run: |
          poetry run ruff check .
          poetry run black --check .

  # Frontend Tests
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Run linting
        working-directory: ./web
        run: npm run lint

      - name: Run type checking
        working-directory: ./web
        run: npm run typecheck

  # Deploy Backend to Render (trigger)
  deploy-backend:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Render
        run: |
          echo "Backend deployment to Render is triggered automatically on push to branch"
          echo "Backend URL will be available in Render dashboard"

  # Deploy Frontend to Vercel Preview
  deploy-frontend:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./web
          scope: ${{ secrets.VERCEL_ORG_ID }}
          alias-domains: pr-${{ github.event.number }}.workplace-tools.vercel.app

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('🚀 Preview Deployment')
            );
            
            const previewUrl = '${{ steps.deploy.outputs.preview-url }}';
            const commentBody = `🚀 **Preview Deployment**
            
            **Frontend Preview:** ${previewUrl}
            
            **Backend API:** https://workplace-tools-api.onrender.com/health
            
            This preview will be automatically updated when new commits are pushed to this PR.
            
            ---
            *This comment was automatically generated by GitHub Actions*`;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }

  # Deploy to Production (main branch only)
  deploy-production:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Frontend to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./web
          vercel-args: '--prod'
          scope: ${{ secrets.VERCEL_ORG_ID }}

  # Smoke Test
  smoke-test:
    needs: [deploy-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Smoke test backend
        run: |
          echo "Testing backend health..."
          curl -f https://workplace-tools-api.onrender.com/health || exit 1
          echo "✅ Backend health check passed"

      - name: Smoke test frontend
        run: |
          echo "Testing frontend preview..."
          curl -f ${{ steps.deploy.outputs.preview-url }} || exit 1
          echo "✅ Frontend smoke test passed"

      - name: Test AI endpoint (mock)
        run: |
          echo "Testing AI endpoint (mock response)..."
          curl -X POST \
            -H "Content-Type: application/json" \
            -d '{"message": "Hello, test!"}' \
            https://workplace-tools-api.onrender.com/api/ai/complete || echo "⚠️ AI endpoint not yet implemented"