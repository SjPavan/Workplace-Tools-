<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Converter - Workplace Tools</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            border-radius: 20px;
            transition: background 0.3s ease;
        }
        
        .back-link:hover {
            background: rgba(255,255,255,0.3);
        }
        
        main {
            padding: 30px;
        }
        
        .input-section {
            margin-bottom: 30px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
            min-height: 120px;
            transition: border-color 0.3s ease;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .case-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        
        .case-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .case-title {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .copy-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s ease;
        }
        
        .copy-btn:hover {
            background: #5a67d8;
        }
        
        .copy-btn.copied {
            background: #28a745;
        }
        
        .case-output {
            font-family: 'Courier New', monospace;
            background: white;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #e1e8ed;
            min-height: 40px;
            word-break: break-all;
        }
        
        .offline-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: none;
            z-index: 1000;
        }
        
        .offline-indicator.offline {
            background: #dc3545;
            display: block;
        }
        
        .offline-indicator.online {
            background: #28a745;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Case Converter</h1>
            <a href="../index.html" class="back-link">← Back to Tools</a>
        </header>
        
        <main>
            <section class="input-section">
                <label for="inputText">Enter your text:</label>
                <textarea id="inputText" placeholder="Type or paste your text here...">Hello World This Is A Test</textarea>
            </section>
            
            <div class="cases-grid">
                <div class="case-card">
                    <div class="case-title">
                        camelCase
                        <button class="copy-btn" data-case="camelCase">Copy</button>
                    </div>
                    <div class="case-output" id="camelCase">helloWorldThisIsATest</div>
                </div>
                
                <div class="case-card">
                    <div class="case-title">
                        PascalCase
                        <button class="copy-btn" data-case="PascalCase">Copy</button>
                    </div>
                    <div class="case-output" id="PascalCase">HelloWorldThisIsATest</div>
                </div>
                
                <div class="case-card">
                    <div class="case-title">
                        snake_case
                        <button class="copy-btn" data-case="snake_case">Copy</button>
                    </div>
                    <div class="case-output" id="snake_case">hello_world_this_is_a_test</div>
                </div>
                
                <div class="case-card">
                    <div class="case-title">
                        kebab-case
                        <button class="copy-btn" data-case="kebab-case">Copy</button>
                    </div>
                    <div class="case-output" id="kebab-case">hello-world-this-is-a-test</div>
                </div>
                
                <div class="case-card">
                    <div class="case-title">
                        UPPER_CASE
                        <button class="copy-btn" data-case="UPPER_CASE">Copy</button>
                    </div>
                    <div class="case-output" id="UPPER_CASE">HELLO_WORLD_THIS_IS_A_TEST</div>
                </div>
                
                <div class="case-card">
                    <div class="case-title">
                        lower case
                        <button class="copy-btn" data-case="lower case">Copy</button>
                    </div>
                    <div class="case-output" id="lower case">hello world this is a test</div>
                </div>
            </div>
        </main>
    </div>
    
    <div class="offline-indicator" id="offlineIndicator">
        <span id="offlineText">Online</span>
    </div>

    <script>
        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('SW registered: ', registration);
                    })
                    .catch(registrationError => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }

        // Online/Offline Status Detection
        const offlineIndicator = document.getElementById('offlineIndicator');
        const offlineText = document.getElementById('offlineText');

        function updateOnlineStatus() {
            if (navigator.onLine) {
                offlineIndicator.classList.remove('offline');
                offlineIndicator.classList.add('online');
                offlineText.textContent = 'Online';
            } else {
                offlineIndicator.classList.remove('online');
                offlineIndicator.classList.add('offline');
                offlineText.textContent = 'Offline';
            }
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        updateOnlineStatus();

        // Case Conversion Functions
        function toCamelCase(str) {
            return str.replace(/(?:^\w|[A-Z]|\b\w)/g, (word, index) => {
                return index === 0 ? word.toLowerCase() : word.toUpperCase();
            }).replace(/\s+/g, '');
        }

        function toPascalCase(str) {
            return str.replace(/(?:^\w|[A-Z]|\b\w)/g, (word) => {
                return word.toUpperCase();
            }).replace(/\s+/g, '');
        }

        function toSnakeCase(str) {
            return str.replace(/\W+/g, ' ')
                      .split(/ |\B(?=[A-Z])/)
                      .map(word => word.toLowerCase())
                      .join('_');
        }

        function toKebabCase(str) {
            return str.replace(/\W+/g, ' ')
                      .split(/ |\B(?=[A-Z])/)
                      .map(word => word.toLowerCase())
                      .join('-');
        }

        function toUpperCase(str) {
            return toSnakeCase(str).toUpperCase();
        }

        function toLowerCase(str) {
            return str.toLowerCase();
        }

        // Update all cases
        function updateAllCases(text) {
            document.getElementById('camelCase').textContent = toCamelCase(text);
            document.getElementById('PascalCase').textContent = toPascalCase(text);
            document.getElementById('snake_case').textContent = toSnakeCase(text);
            document.getElementById('kebab-case').textContent = toKebabCase(text);
            document.getElementById('UPPER_CASE').textContent = toUpperCase(text);
            document.getElementById('lower case').textContent = toLowerCase(text);
        }

        // Copy to clipboard functionality
        document.querySelectorAll('.copy-btn').forEach(btn => {
            btn.addEventListener('click', async function() {
                const caseType = this.dataset.case;
                const outputElement = document.getElementById(caseType);
                const text = outputElement.textContent;
                
                try {
                    await navigator.clipboard.writeText(text);
                    this.textContent = 'Copied!';
                    this.classList.add('copied');
                    
                    setTimeout(() => {
                        this.textContent = 'Copy';
                        this.classList.remove('copied');
                    }, 2000);
                } catch (err) {
                    console.error('Failed to copy text: ', err);
                }
            });
        });

        // Input event listener
        document.getElementById('inputText').addEventListener('input', function() {
            updateAllCases(this.value);
        });

        // Initialize with default text
        updateAllCases(document.getElementById('inputText').value);
    </script>
</body>
</html>
